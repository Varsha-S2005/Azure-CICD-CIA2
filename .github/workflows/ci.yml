
name: Azure CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean verify

      - name: Build Docker Image
        run: docker build -t azure-cicd:${{ github.sha }} .

      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push'
        run: az acr login --name acrcia2s2026

      - name: Build and Push Image to ACR
        if: github.event_name == 'push'
        run: |
          IMAGE=acrcia2s2026.azurecr.io/azure-cicd:${GITHUB_SHA}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Get AKS Credentials
        if: github.event_name == 'push'
        run: |
          az aks get-credentials \
            --resource-group rg-azure-cicd-cia2 \
            --name aks-azure-cicd-cia2 \
            --overwrite-existing

      - name: Deploy to AKS
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: .*|image: acrcia2s2026.azurecr.io/azure-cicd:${GITHUB_SHA}|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/azure-cicd-deployment --timeout=180s
